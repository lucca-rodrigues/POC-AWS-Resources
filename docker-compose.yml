services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      # Local directory bind mount (default)
      - ./data:/app/data

      # Docker socket — required for Lambda (and RDS/ElastiCache/OpenSearch/MSK/ECS)
      - /var/run/docker.sock:/var/run/docker.sock

      # OR named volume (optional):
      # - floci-data:/app/data

#volumes:
#  floci-data:
